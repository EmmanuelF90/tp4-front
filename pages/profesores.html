<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Profesores</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <h1>Gestión de Profesores</h1>

    <h2>Nuevo Profesor</h2>

    <input id="nombre" placeholder="Nombre">
    <input id="especialidad" placeholder="Especialidad">
    <input id="email" placeholder="Email">

    <button onclick="crearProfesor()">
        Crear Profesor
    </button>

    <hr>

    <h2>Listado de Profesores</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Email</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tablaProfesores">
        </tbody>
    </table>

    <script src="js/profesores.js"></script>

</body>
</html>
